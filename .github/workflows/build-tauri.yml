name: Build Tauri App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows' || github.event_name == 'push' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Copy frontend to embed directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path server/internal/web/dist
          Copy-Item -Path web/dist/* -Destination server/internal/web/dist -Recurse -Force
          # Remove source maps
          Get-ChildItem -Path server/internal/web/dist -Filter "*.map" -Recurse | Remove-Item -Force

      - name: Build Go sidecar
        working-directory: server
        run: |
          go build -ldflags="-s -w" -o ../tauri-app/src-tauri/binaries/echo-server-x86_64-pc-windows-msvc.exe ./cmd/echo/
          Copy-Item -Path ../tauri-app/src-tauri/binaries/echo-server-x86_64-pc-windows-msvc.exe -Destination ../tauri-app/src-tauri/bin/

      - name: Install Tauri dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Build Tauri app
        working-directory: tauri-app
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            tauri-app/src-tauri/target/release/bundle/nsis/*.exe
            tauri-app/src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos' || github.event_name == 'push' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Copy frontend to embed directory
        run: |
          mkdir -p server/internal/web/dist
          rsync -av --exclude='*.map' web/dist/ server/internal/web/dist/

      - name: Build Go sidecar (arm64)
        working-directory: server
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../tauri-app/src-tauri/binaries/echo-server-aarch64-apple-darwin ./cmd/echo/
          mkdir -p ../tauri-app/src-tauri/bin
          cp ../tauri-app/src-tauri/binaries/echo-server-aarch64-apple-darwin ../tauri-app/src-tauri/bin/

      - name: Build Go sidecar (x64)
        working-directory: server
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../tauri-app/src-tauri/binaries/echo-server-x86_64-apple-darwin ./cmd/echo/
          cp ../tauri-app/src-tauri/binaries/echo-server-x86_64-apple-darwin ../tauri-app/src-tauri/bin/

      - name: Install Tauri dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Build Tauri app (arm64)
        working-directory: tauri-app
        run: npm run build -- --target aarch64-apple-darwin

      - name: Build Tauri app (x64)
        working-directory: tauri-app
        run: npm run build -- --target x86_64-apple-darwin

      - name: Install fileicon
        run: brew install fileicon

      - name: Set DMG icons
        run: |
          for dmg in tauri-app/src-tauri/target/*/release/bundle/dmg/*.dmg; do
            if [ -f "$dmg" ]; then
              fileicon set "$dmg" tauri-app/src-tauri/icons/icon.icns || true
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            tauri-app/src-tauri/target/*/release/bundle/dmg/*.dmg
            tauri-app/src-tauri/target/*/release/bundle/macos/*.app

  build-linux:
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Copy frontend to embed directory
        run: |
          mkdir -p server/internal/web/dist
          rsync -av --exclude='*.map' web/dist/ server/internal/web/dist/

      - name: Build Go sidecar
        working-directory: server
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o ../tauri-app/src-tauri/binaries/echo-server-x86_64-unknown-linux-gnu ./cmd/echo/
          mkdir -p ../tauri-app/src-tauri/bin
          cp ../tauri-app/src-tauri/binaries/echo-server-x86_64-unknown-linux-gnu ../tauri-app/src-tauri/bin/

      - name: Install Tauri dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Build Tauri app
        working-directory: tauri-app
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            tauri-app/src-tauri/target/release/bundle/appimage/*.AppImage
            tauri-app/src-tauri/target/release/bundle/deb/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
          draft: true
          generate_release_notes: true
