name: Runtime Contract Gate

on:
  push:
    paths:
      - "server/internal/bootstrap/**"
      - "server/internal/harness/**"
      - ".github/workflows/runtime-contract-gate.yml"
  pull_request:
    paths:
      - "server/internal/bootstrap/**"
      - "server/internal/harness/**"
      - ".github/workflows/runtime-contract-gate.yml"
  workflow_dispatch:

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Run runtime contract gate
        working-directory: server
        run: go test ./internal/bootstrap -run 'TestRuntimeContract_|TestContract_' -count=1
