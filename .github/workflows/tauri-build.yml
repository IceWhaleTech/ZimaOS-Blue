# Tauri Desktop Application Build Workflow
# Builds ZimaOS Echo desktop app for Windows and macOS

name: Tauri Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'tauri-app/**'
      - 'web/**'
      - 'server/**'
      - '.github/workflows/tauri-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tauri-app/**'
      - 'web/**'
      - 'server/**'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release'
        required: false
        default: 'false'
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  build-go-sidecar:
    name: Build Go Sidecar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            go_os: darwin
            go_arch: arm64
            binary_name: echo-server-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            go_os: darwin
            go_arch: amd64
            binary_name: echo-server-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            go_os: windows
            go_arch: amd64
            binary_name: echo-server-x86_64-pc-windows-msvc.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Copy frontend to server
        shell: bash
        run: |
          mkdir -p server/internal/web/dist
          cp -r web/dist/* server/internal/web/dist/

      - name: Build Go server
        working-directory: server
        env:
          GOOS: ${{ matrix.go_os }}
          GOARCH: ${{ matrix.go_arch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o ../tauri-app/src-tauri/bin/${{ matrix.binary_name }} ./cmd/echo

      - name: Upload sidecar binary
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: tauri-app/src-tauri/bin/${{ matrix.binary_name }}
          retention-days: 1

  build-tauri:
    name: Build Tauri App
    needs: build-go-sidecar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar_artifact: sidecar-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            sidecar_artifact: sidecar-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_artifact: sidecar-x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Tauri dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Download sidecar binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sidecar_artifact }}
          path: tauri-app/src-tauri/bin/

      - name: Make sidecar executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x tauri-app/src-tauri/bin/*

      - name: Generate icons (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install imagemagick
          chmod +x scripts/generate-icons.sh
          ./scripts/generate-icons.sh

      - name: Generate icons (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Download and install ImageMagick portable
          $url = "https://imagemagick.org/archive/binaries/ImageMagick-7.1.1-43-portable-Q16-x64.zip"
          $output = "imagemagick.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath "imagemagick"
          $env:PATH = "$PWD\imagemagick;$env:PATH"

          # Generate icons from source logo
          $iconsDir = "tauri-app/src-tauri/icons"
          $sourceLogo = "docs/public/logo.png"
          New-Item -ItemType Directory -Force -Path $iconsDir

          if (Test-Path $sourceLogo) {
            Write-Host "Using source logo: $sourceLogo"
            .\imagemagick\magick.exe $sourceLogo -resize 1024x1024 -alpha set -background none PNG32:"$iconsDir/icon-1024.png"
          } else {
            Write-Host "Source logo not found, generating placeholder..."
            .\imagemagick\magick.exe -size 1024x1024 xc:"#3B82F6" -alpha set -background none PNG32:"$iconsDir/icon-1024.png"
          }

          # Create icons from source
          .\imagemagick\magick.exe "$iconsDir/icon-1024.png" -resize 32x32 PNG32:"$iconsDir/32x32.png"
          .\imagemagick\magick.exe "$iconsDir/icon-1024.png" -resize 128x128 PNG32:"$iconsDir/128x128.png"
          .\imagemagick\magick.exe "$iconsDir/icon-1024.png" -resize 256x256 PNG32:"$iconsDir/128x128@2x.png"
          .\imagemagick\magick.exe "$iconsDir/icon-1024.png" -resize 22x22 PNG32:"$iconsDir/tray.png"
          .\imagemagick\magick.exe "$iconsDir/icon-1024.png" -define icon:auto-resize=256,128,64,48,32,16 "$iconsDir/icon.ico"

          # Create placeholder icon.icns (will be replaced by proper one on macOS)
          Copy-Item "$iconsDir/128x128.png" "$iconsDir/icon.icns"

          # Cleanup
          Remove-Item "$iconsDir/icon-1024.png" -ErrorAction SilentlyContinue

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tauri-app
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.target }}
          path: |
            tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 7

  release:
    name: Create Release
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release

          # macOS ARM64
          if [ -d "artifacts/tauri-aarch64-apple-darwin" ]; then
            cp artifacts/tauri-aarch64-apple-darwin/dmg/*.dmg release/ 2>/dev/null || true
            cp artifacts/tauri-aarch64-apple-darwin/macos/*.app.tar.gz release/ 2>/dev/null || true
          fi

          # macOS x64
          if [ -d "artifacts/tauri-x86_64-apple-darwin" ]; then
            cp artifacts/tauri-x86_64-apple-darwin/dmg/*.dmg release/ 2>/dev/null || true
            cp artifacts/tauri-x86_64-apple-darwin/macos/*.app.tar.gz release/ 2>/dev/null || true
          fi

          # Windows
          if [ -d "artifacts/tauri-x86_64-pc-windows-msvc" ]; then
            cp artifacts/tauri-x86_64-pc-windows-msvc/nsis/*.exe release/ 2>/dev/null || true
            cp artifacts/tauri-x86_64-pc-windows-msvc/msi/*.msi release/ 2>/dev/null || true
          fi

          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
