name: Cutover Candidate Pipeline

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Blue API base URL, for example https://blue.example.com/api/v1
        required: false
        type: string
        default: ""
      owner:
        description: Harness owner user id
        required: false
        type: string
        default: "release-gate"
      candidate_id:
        description: Stable candidate id shared across all gates
        required: false
        type: string
        default: ""
      candidate_label:
        description: Human-readable candidate label
        required: false
        type: string
        default: ""
      selector_eval_spec_id:
        description: Optional selector eval spec id override
        required: false
        type: string
        default: ""
      execution_eval_spec_id:
        description: Optional execution eval spec id override
        required: false
        type: string
        default: ""
      selector_baseline_id:
        description: Optional selector baseline id override
        required: false
        type: string
        default: ""
      selector_base_eval_run_id:
        description: Optional selector base eval run id override
        required: false
        type: string
        default: ""
      execution_baseline_id:
        description: Optional execution baseline id override
        required: false
        type: string
        default: ""
      execution_base_eval_run_id:
        description: Optional execution base eval run id override
        required: false
        type: string
        default: ""
      budget_baseline_id:
        description: Optional budget baseline id override
        required: false
        type: string
        default: ""
      budget_base_eval_run_id:
        description: Optional budget base eval run id override
        required: false
        type: string
        default: ""
      required_consecutive_runs:
        description: Required consecutive green count per lane for readiness
        required: false
        type: string
        default: "2"
      max_assessments:
        description: Maximum readiness assessments returned per lane
        required: false
        type: string
        default: "5"
      require_consecutive_green:
        description: Require this many consecutive green full pipeline attempts
        required: false
        type: string
        default: "2"
      history_limit_runs:
        description: Number of prior workflow runs to inspect for pipeline history
        required: false
        type: string
        default: "10"
      history_branch:
        description: Optional branch filter for pipeline history artifact downloads
        required: false
        type: string
        default: ""
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  actions: read

jobs:
  cutover-candidate-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INPUT_SERVER_URL: ${{ github.event.inputs.server_url || '' }}
      INPUT_OWNER: ${{ github.event.inputs.owner || '' }}
      INPUT_CANDIDATE_ID: ${{ github.event.inputs.candidate_id || '' }}
      INPUT_CANDIDATE_LABEL: ${{ github.event.inputs.candidate_label || '' }}
      INPUT_SELECTOR_EVAL_SPEC_ID: ${{ github.event.inputs.selector_eval_spec_id || '' }}
      INPUT_EXECUTION_EVAL_SPEC_ID: ${{ github.event.inputs.execution_eval_spec_id || '' }}
      INPUT_SELECTOR_BASELINE_ID: ${{ github.event.inputs.selector_baseline_id || '' }}
      INPUT_SELECTOR_BASE_EVAL_RUN_ID: ${{ github.event.inputs.selector_base_eval_run_id || '' }}
      INPUT_EXECUTION_BASELINE_ID: ${{ github.event.inputs.execution_baseline_id || '' }}
      INPUT_EXECUTION_BASE_EVAL_RUN_ID: ${{ github.event.inputs.execution_base_eval_run_id || '' }}
      INPUT_BUDGET_BASELINE_ID: ${{ github.event.inputs.budget_baseline_id || '' }}
      INPUT_BUDGET_BASE_EVAL_RUN_ID: ${{ github.event.inputs.budget_base_eval_run_id || '' }}
      INPUT_REQUIRED_CONSECUTIVE_RUNS: ${{ github.event.inputs.required_consecutive_runs || '2' }}
      INPUT_MAX_ASSESSMENTS: ${{ github.event.inputs.max_assessments || '5' }}
      # Keep advanced gate thresholds pinned to the default release policy so the
      # manual dispatch form stays within GitHub's 25-input workflow_dispatch cap.
      INPUT_MIN_PASS_RATE: '0.98'
      INPUT_MIN_CRITICAL_PASS_RATE: '1.0'
      INPUT_MIN_ROUTE_AGREEMENT_RATE: ''
      INPUT_MIN_ROUTE_COMPATIBLE_RATE: '0.95'
      INPUT_MAX_CLARIFY_RATE_DELTA: '0.01'
      INPUT_SELECTOR_MAX_CRITICAL_REGRESSIONS: '0'
      INPUT_MAX_PASS_RATE_DROP: '0.01'
      INPUT_EXECUTION_MAX_CRITICAL_REGRESSIONS: '0'
      INPUT_MAX_VERIFICATION_PASS_RATE_DROP: '0'
      INPUT_MAX_EVIDENCE_BACKED_PASS_RATE_DROP: '0'
      INPUT_MIN_MEDIAN_SCHEMA_BYTE_REDUCTION_RATE: '0.80'
      INPUT_MAX_MEDIAN_LATENCY_INCREASE_RATE: '0.10'
      INPUT_ALLOWED_FINAL_NATIVE_TOOLS: 'exec'
      INPUT_REQUIRE_CONSECUTIVE_GREEN: ${{ github.event.inputs.require_consecutive_green || '2' }}
      INPUT_HISTORY_LIMIT_RUNS: ${{ github.event.inputs.history_limit_runs || '10' }}
      INPUT_HISTORY_BRANCH: ${{ github.event.inputs.history_branch || '' }}
      SECRET_SERVER_URL: ${{ secrets.BLUE_CUTOVER_PIPELINE_SERVER_URL }}
      FALLBACK_SERVER_URL: ${{ secrets.BLUE_HARNESS_SERVER_URL }}
      SECRET_SELECTOR_BASELINE_ID: ${{ secrets.BLUE_SELECTOR_GATE_BASELINE_ID }}
      SECRET_SELECTOR_BASE_EVAL_RUN_ID: ${{ secrets.BLUE_SELECTOR_GATE_BASE_EVAL_RUN_ID }}
      SECRET_EXECUTION_BASELINE_ID: ${{ secrets.BLUE_EXECUTION_GATE_BASELINE_ID }}
      SECRET_EXECUTION_BASE_EVAL_RUN_ID: ${{ secrets.BLUE_EXECUTION_GATE_BASE_EVAL_RUN_ID }}
      SECRET_BUDGET_BASELINE_ID: ${{ secrets.BLUE_BUDGET_GATE_BASELINE_ID }}
      SECRET_BUDGET_BASE_EVAL_RUN_ID: ${{ secrets.BLUE_BUDGET_GATE_BASE_EVAL_RUN_ID }}
      BLUE_API_KEY: ${{ secrets.BLUE_CUTOVER_PIPELINE_API_KEY || secrets.BLUE_HARNESS_API_KEY }}
      BLUE_BEARER_TOKEN: ${{ secrets.BLUE_CUTOVER_PIPELINE_BEARER_TOKEN || secrets.BLUE_HARNESS_BEARER_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve workflow configuration
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          branch_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-detached}}"
          branch_slug="$(printf '%s' "$branch_ref" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$branch_slug" ]; then
            branch_slug="detached"
          fi

          server_url="${INPUT_SERVER_URL:-${SECRET_SERVER_URL:-${FALLBACK_SERVER_URL:-}}}"
          owner="${INPUT_OWNER:-release-gate}"
          candidate_label="${INPUT_CANDIDATE_LABEL:-$branch_slug}"
          candidate_id="${INPUT_CANDIDATE_ID:-$candidate_label}"
          selector_baseline_id="${INPUT_SELECTOR_BASELINE_ID:-${SECRET_SELECTOR_BASELINE_ID:-}}"
          selector_base_eval_run_id="${INPUT_SELECTOR_BASE_EVAL_RUN_ID:-${SECRET_SELECTOR_BASE_EVAL_RUN_ID:-}}"
          execution_baseline_id="${INPUT_EXECUTION_BASELINE_ID:-${SECRET_EXECUTION_BASELINE_ID:-}}"
          execution_base_eval_run_id="${INPUT_EXECUTION_BASE_EVAL_RUN_ID:-${SECRET_EXECUTION_BASE_EVAL_RUN_ID:-}}"
          budget_baseline_id="${INPUT_BUDGET_BASELINE_ID:-${SECRET_BUDGET_BASELINE_ID:-}}"
          budget_base_eval_run_id="${INPUT_BUDGET_BASE_EVAL_RUN_ID:-${SECRET_BUDGET_BASE_EVAL_RUN_ID:-}}"
          history_branch="${INPUT_HISTORY_BRANCH:-$branch_ref}"

          skip_reason=""
          if [ -z "$server_url" ]; then
            skip_reason="No server URL configured. Set workflow input server_url or repository secret BLUE_CUTOVER_PIPELINE_SERVER_URL or BLUE_HARNESS_SERVER_URL."
          elif [ -z "$selector_baseline_id" ] && [ -z "$selector_base_eval_run_id" ]; then
            skip_reason="Selector comparison base is missing for the cutover pipeline."
          elif [ -z "$execution_baseline_id" ] && [ -z "$execution_base_eval_run_id" ]; then
            skip_reason="Execution comparison base is missing for the cutover pipeline."
          elif [ -z "$budget_baseline_id" ] && [ -z "$budget_base_eval_run_id" ]; then
            skip_reason="Budget comparison base is missing for the cutover pipeline."
          fi

          {
            echo "server_url=$server_url"
            echo "owner=$owner"
            echo "candidate_id=$candidate_id"
            echo "candidate_label=$candidate_label"
            echo "selector_baseline_id=$selector_baseline_id"
            echo "selector_base_eval_run_id=$selector_base_eval_run_id"
            echo "execution_baseline_id=$execution_baseline_id"
            echo "execution_base_eval_run_id=$execution_base_eval_run_id"
            echo "budget_baseline_id=$budget_baseline_id"
            echo "budget_base_eval_run_id=$budget_base_eval_run_id"
            echo "history_branch=$history_branch"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$skip_reason" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=$skip_reason" >> "$GITHUB_OUTPUT"
            {
              echo "## Cutover Candidate Pipeline"
              echo
              echo "Skipped: $skip_reason"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cutover candidate pipeline
        if: steps.resolve.outputs.skip != 'true'
        id: pipeline
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          args=(
            python3 scripts/cutover_candidate_pipeline.py
            --blue-base-url "${{ steps.resolve.outputs.server_url }}"
            --owner "${{ steps.resolve.outputs.owner }}"
            --candidate-id "${{ steps.resolve.outputs.candidate_id }}"
            --candidate-label "${{ steps.resolve.outputs.candidate_label }}"
            --selector-baseline-id "${{ steps.resolve.outputs.selector_baseline_id }}"
            --execution-baseline-id "${{ steps.resolve.outputs.execution_baseline_id }}"
            --budget-baseline-id "${{ steps.resolve.outputs.budget_baseline_id }}"
            --required-consecutive-runs "${INPUT_REQUIRED_CONSECUTIVE_RUNS}"
            --max-assessments "${INPUT_MAX_ASSESSMENTS}"
            --min-pass-rate "${INPUT_MIN_PASS_RATE}"
            --min-critical-pass-rate "${INPUT_MIN_CRITICAL_PASS_RATE}"
            --min-route-compatible-rate "${INPUT_MIN_ROUTE_COMPATIBLE_RATE}"
            --max-clarify-rate-delta "${INPUT_MAX_CLARIFY_RATE_DELTA}"
            --selector-max-critical-regressions "${INPUT_SELECTOR_MAX_CRITICAL_REGRESSIONS}"
            --max-pass-rate-drop "${INPUT_MAX_PASS_RATE_DROP}"
            --execution-max-critical-regressions "${INPUT_EXECUTION_MAX_CRITICAL_REGRESSIONS}"
            --max-verification-pass-rate-drop "${INPUT_MAX_VERIFICATION_PASS_RATE_DROP}"
            --max-evidence-backed-pass-rate-drop "${INPUT_MAX_EVIDENCE_BACKED_PASS_RATE_DROP}"
            --min-median-schema-byte-reduction-rate "${INPUT_MIN_MEDIAN_SCHEMA_BYTE_REDUCTION_RATE}"
            --max-median-latency-increase-rate "${INPUT_MAX_MEDIAN_LATENCY_INCREASE_RATE}"
            --allowed-final-native-tools "${INPUT_ALLOWED_FINAL_NATIVE_TOOLS}"
            --require-consecutive-green "${INPUT_REQUIRE_CONSECUTIVE_GREEN}"
            --history-artifacts-dir docs/reports/cutover_candidate_pipeline/history_artifacts
            --history-output-json docs/reports/cutover_candidate_pipeline/cutover_candidate_pipeline_history_report.json
            --history-output-md docs/reports/cutover_candidate_pipeline/cutover_candidate_pipeline_history_report.md
            --history-limit-runs "${INPUT_HISTORY_LIMIT_RUNS}"
            --history-workflow cutover-candidate-pipeline.yml
            --history-artifact-name cutover-candidate-pipeline-report
            --history-branch "${{ steps.resolve.outputs.history_branch }}"
            --github-repo "${GITHUB_REPOSITORY}"
            --github-token "${GITHUB_TOKEN}"
            --output-dir docs/reports/cutover_candidate_pipeline
          )

          if [ -n "${INPUT_SELECTOR_EVAL_SPEC_ID}" ]; then
            args+=(--selector-eval-spec-id "${INPUT_SELECTOR_EVAL_SPEC_ID}")
          fi
          if [ -n "${INPUT_EXECUTION_EVAL_SPEC_ID}" ]; then
            args+=(--execution-eval-spec-id "${INPUT_EXECUTION_EVAL_SPEC_ID}")
          fi
          if [ -n "${{ steps.resolve.outputs.selector_base_eval_run_id }}" ]; then
            args+=(--selector-base-eval-run-id "${{ steps.resolve.outputs.selector_base_eval_run_id }}")
          fi
          if [ -n "${{ steps.resolve.outputs.execution_base_eval_run_id }}" ]; then
            args+=(--execution-base-eval-run-id "${{ steps.resolve.outputs.execution_base_eval_run_id }}")
          fi
          if [ -n "${{ steps.resolve.outputs.budget_base_eval_run_id }}" ]; then
            args+=(--budget-base-eval-run-id "${{ steps.resolve.outputs.budget_base_eval_run_id }}")
          fi
          if [ -n "${INPUT_MIN_ROUTE_AGREEMENT_RATE}" ]; then
            args+=(--min-route-agreement-rate "${INPUT_MIN_ROUTE_AGREEMENT_RATE}")
          fi

          "${args[@]}"

      - name: Publish cutover candidate pipeline summary
        if: always() && steps.resolve.outputs.skip != 'true'
        shell: bash
        run: |
          {
            echo "## Cutover Candidate Pipeline"
            echo
            if [ -f docs/reports/cutover_candidate_pipeline/cutover_candidate_pipeline_report.md ]; then
              cat docs/reports/cutover_candidate_pipeline/cutover_candidate_pipeline_report.md
            else
              echo "Report missing: docs/reports/cutover_candidate_pipeline/cutover_candidate_pipeline_report.md"
            fi
            if [ -f docs/reports/cutover_candidate_pipeline/cutover_candidate_pipeline_history_report.md ]; then
              echo
              cat docs/reports/cutover_candidate_pipeline/cutover_candidate_pipeline_history_report.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cutover candidate pipeline artifacts
        if: always() && steps.resolve.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cutover-candidate-pipeline-report
          if-no-files-found: warn
          path: |
            docs/reports/cutover_candidate_pipeline/cutover_candidate_pipeline_report.json
            docs/reports/cutover_candidate_pipeline/cutover_candidate_pipeline_report.md
            docs/reports/cutover_candidate_pipeline/cutover_candidate_pipeline_history_report.json
            docs/reports/cutover_candidate_pipeline/cutover_candidate_pipeline_history_report.md

      - name: Enforce cutover candidate pipeline verdict
        if: always() && steps.resolve.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path("docs/reports/cutover_candidate_pipeline/cutover_candidate_pipeline_report.json")
          if not report_path.is_file():
              print("cutover candidate pipeline report was not generated", file=sys.stderr)
              sys.exit(1)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          if not bool(report.get("ready")):
              print(f"cutover candidate pipeline failed with status={report.get('status')}", file=sys.stderr)
              sys.exit(1)

          print("cutover candidate pipeline passed")
          PY
