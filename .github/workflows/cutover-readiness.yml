name: Cutover Readiness

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Blue API base URL, for example https://blue.example.com/api/v1
        required: false
        type: string
        default: ""
      owner:
        description: Harness owner user id
        required: false
        type: string
        default: "release-gate"
      candidate_id:
        description: Stable candidate id shared across selector, execution, and budget lanes
        required: false
        type: string
        default: ""
      required_consecutive_runs:
        description: Required consecutive green count per lane
        required: false
        type: string
        default: "2"
      max_assessments:
        description: Maximum readiness assessments returned per lane
        required: false
        type: string
        default: "5"
      selector_baseline_id:
        description: Optional selector baseline id override
        required: false
        type: string
        default: ""
      selector_base_eval_run_id:
        description: Optional selector base eval run id override
        required: false
        type: string
        default: ""
      execution_baseline_id:
        description: Optional execution baseline id override
        required: false
        type: string
        default: ""
      execution_base_eval_run_id:
        description: Optional execution base eval run id override
        required: false
        type: string
        default: ""
      budget_baseline_id:
        description: Optional budget baseline id override
        required: false
        type: string
        default: ""
      budget_base_eval_run_id:
        description: Optional budget base eval run id override
        required: false
        type: string
        default: ""
      min_pass_rate:
        description: Selector minimum curated pass rate
        required: false
        type: string
        default: "0.98"
      min_critical_pass_rate:
        description: Selector minimum critical curated pass rate
        required: false
        type: string
        default: "1.0"
      min_route_agreement_rate:
        description: Optional selector minimum route agreement rate
        required: false
        type: string
        default: ""
      min_route_compatible_rate:
        description: Selector minimum route compatibility rate
        required: false
        type: string
        default: "0.95"
      max_clarify_rate_delta:
        description: Selector maximum clarify-rate delta
        required: false
        type: string
        default: "0.01"
      selector_max_critical_regressions:
        description: Maximum selector critical regressions
        required: false
        type: string
        default: "0"
      max_pass_rate_drop:
        description: Execution maximum pass-rate drop
        required: false
        type: string
        default: "0.01"
      execution_max_critical_regressions:
        description: Maximum execution critical regressions
        required: false
        type: string
        default: "0"
      max_verification_pass_rate_drop:
        description: Execution maximum verification pass-rate drop
        required: false
        type: string
        default: "0"
      max_evidence_backed_pass_rate_drop:
        description: Execution maximum evidence-backed pass-rate drop
        required: false
        type: string
        default: "0"
      min_median_schema_byte_reduction_rate:
        description: Budget minimum schema-byte reduction rate
        required: false
        type: string
        default: "0.80"
      max_median_latency_increase_rate:
        description: Budget maximum latency increase rate
        required: false
        type: string
        default: "0.10"
      allowed_final_native_tools:
        description: Comma-separated allowed final native tools
        required: false
        type: string
        default: "exec"
  schedule:
    - cron: "47 4 * * *"

permissions:
  contents: read

jobs:
  cutover-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INPUT_SERVER_URL: ${{ github.event.inputs.server_url || '' }}
      INPUT_OWNER: ${{ github.event.inputs.owner || '' }}
      INPUT_CANDIDATE_ID: ${{ github.event.inputs.candidate_id || '' }}
      INPUT_REQUIRED_CONSECUTIVE_RUNS: ${{ github.event.inputs.required_consecutive_runs || '2' }}
      INPUT_MAX_ASSESSMENTS: ${{ github.event.inputs.max_assessments || '5' }}
      INPUT_SELECTOR_BASELINE_ID: ${{ github.event.inputs.selector_baseline_id || '' }}
      INPUT_SELECTOR_BASE_EVAL_RUN_ID: ${{ github.event.inputs.selector_base_eval_run_id || '' }}
      INPUT_EXECUTION_BASELINE_ID: ${{ github.event.inputs.execution_baseline_id || '' }}
      INPUT_EXECUTION_BASE_EVAL_RUN_ID: ${{ github.event.inputs.execution_base_eval_run_id || '' }}
      INPUT_BUDGET_BASELINE_ID: ${{ github.event.inputs.budget_baseline_id || '' }}
      INPUT_BUDGET_BASE_EVAL_RUN_ID: ${{ github.event.inputs.budget_base_eval_run_id || '' }}
      INPUT_MIN_PASS_RATE: ${{ github.event.inputs.min_pass_rate || '0.98' }}
      INPUT_MIN_CRITICAL_PASS_RATE: ${{ github.event.inputs.min_critical_pass_rate || '1.0' }}
      INPUT_MIN_ROUTE_AGREEMENT_RATE: ${{ github.event.inputs.min_route_agreement_rate || '' }}
      INPUT_MIN_ROUTE_COMPATIBLE_RATE: ${{ github.event.inputs.min_route_compatible_rate || '0.95' }}
      INPUT_MAX_CLARIFY_RATE_DELTA: ${{ github.event.inputs.max_clarify_rate_delta || '0.01' }}
      INPUT_SELECTOR_MAX_CRITICAL_REGRESSIONS: ${{ github.event.inputs.selector_max_critical_regressions || '0' }}
      INPUT_MAX_PASS_RATE_DROP: ${{ github.event.inputs.max_pass_rate_drop || '0.01' }}
      INPUT_EXECUTION_MAX_CRITICAL_REGRESSIONS: ${{ github.event.inputs.execution_max_critical_regressions || '0' }}
      INPUT_MAX_VERIFICATION_PASS_RATE_DROP: ${{ github.event.inputs.max_verification_pass_rate_drop || '0' }}
      INPUT_MAX_EVIDENCE_BACKED_PASS_RATE_DROP: ${{ github.event.inputs.max_evidence_backed_pass_rate_drop || '0' }}
      INPUT_MIN_MEDIAN_SCHEMA_BYTE_REDUCTION_RATE: ${{ github.event.inputs.min_median_schema_byte_reduction_rate || '0.80' }}
      INPUT_MAX_MEDIAN_LATENCY_INCREASE_RATE: ${{ github.event.inputs.max_median_latency_increase_rate || '0.10' }}
      INPUT_ALLOWED_FINAL_NATIVE_TOOLS: ${{ github.event.inputs.allowed_final_native_tools || 'exec' }}
      SECRET_SERVER_URL: ${{ secrets.BLUE_CUTOVER_READINESS_SERVER_URL }}
      FALLBACK_SERVER_URL: ${{ secrets.BLUE_HARNESS_SERVER_URL }}
      SECRET_SELECTOR_BASELINE_ID: ${{ secrets.BLUE_SELECTOR_GATE_BASELINE_ID }}
      SECRET_SELECTOR_BASE_EVAL_RUN_ID: ${{ secrets.BLUE_SELECTOR_GATE_BASE_EVAL_RUN_ID }}
      SECRET_EXECUTION_BASELINE_ID: ${{ secrets.BLUE_EXECUTION_GATE_BASELINE_ID }}
      SECRET_EXECUTION_BASE_EVAL_RUN_ID: ${{ secrets.BLUE_EXECUTION_GATE_BASE_EVAL_RUN_ID }}
      SECRET_BUDGET_BASELINE_ID: ${{ secrets.BLUE_BUDGET_GATE_BASELINE_ID }}
      SECRET_BUDGET_BASE_EVAL_RUN_ID: ${{ secrets.BLUE_BUDGET_GATE_BASE_EVAL_RUN_ID }}
      BLUE_API_KEY: ${{ secrets.BLUE_CUTOVER_READINESS_API_KEY || secrets.BLUE_HARNESS_API_KEY }}
      BLUE_BEARER_TOKEN: ${{ secrets.BLUE_CUTOVER_READINESS_BEARER_TOKEN || secrets.BLUE_HARNESS_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve workflow configuration
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          branch_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-detached}}"
          branch_slug="$(printf '%s' "$branch_ref" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$branch_slug" ]; then
            branch_slug="detached"
          fi

          server_url="${INPUT_SERVER_URL:-${SECRET_SERVER_URL:-${FALLBACK_SERVER_URL:-}}}"
          owner="${INPUT_OWNER:-release-gate}"
          candidate_id="${INPUT_CANDIDATE_ID:-$branch_slug}"

          selector_baseline_id="${INPUT_SELECTOR_BASELINE_ID:-${SECRET_SELECTOR_BASELINE_ID:-}}"
          selector_base_eval_run_id="${INPUT_SELECTOR_BASE_EVAL_RUN_ID:-${SECRET_SELECTOR_BASE_EVAL_RUN_ID:-}}"
          execution_baseline_id="${INPUT_EXECUTION_BASELINE_ID:-${SECRET_EXECUTION_BASELINE_ID:-}}"
          execution_base_eval_run_id="${INPUT_EXECUTION_BASE_EVAL_RUN_ID:-${SECRET_EXECUTION_BASE_EVAL_RUN_ID:-}}"
          budget_baseline_id="${INPUT_BUDGET_BASELINE_ID:-${SECRET_BUDGET_BASELINE_ID:-}}"
          budget_base_eval_run_id="${INPUT_BUDGET_BASE_EVAL_RUN_ID:-${SECRET_BUDGET_BASE_EVAL_RUN_ID:-}}"

          skip_reason=""
          if [ -z "$server_url" ]; then
            skip_reason="No server URL configured. Set workflow input server_url or repository secret BLUE_CUTOVER_READINESS_SERVER_URL or BLUE_HARNESS_SERVER_URL."
          fi

          {
            echo "server_url=$server_url"
            echo "owner=$owner"
            echo "candidate_id=$candidate_id"
            echo "selector_baseline_id=$selector_baseline_id"
            echo "selector_base_eval_run_id=$selector_base_eval_run_id"
            echo "execution_baseline_id=$execution_baseline_id"
            echo "execution_base_eval_run_id=$execution_base_eval_run_id"
            echo "budget_baseline_id=$budget_baseline_id"
            echo "budget_base_eval_run_id=$budget_base_eval_run_id"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$skip_reason" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=$skip_reason" >> "$GITHUB_OUTPUT"
            {
              echo "## Cutover Readiness"
              echo
              echo "Skipped: $skip_reason"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cutover readiness
        if: steps.resolve.outputs.skip != 'true'
        id: readiness
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          args=(
            python3 scripts/cutover_readiness_runner.py
            --blue-base-url "${{ steps.resolve.outputs.server_url }}"
            --owner "${{ steps.resolve.outputs.owner }}"
            --candidate-id "${{ steps.resolve.outputs.candidate_id }}"
            --required-consecutive-runs "${INPUT_REQUIRED_CONSECUTIVE_RUNS}"
            --max-assessments "${INPUT_MAX_ASSESSMENTS}"
            --output-json docs/reports/cutover_readiness_report.json
            --output-md docs/reports/cutover_readiness_report.md
          )

          if [ -n "${{ steps.resolve.outputs.selector_baseline_id }}" ]; then
            args+=(--selector-baseline-id "${{ steps.resolve.outputs.selector_baseline_id }}")
          fi
          if [ -n "${{ steps.resolve.outputs.selector_base_eval_run_id }}" ]; then
            args+=(--selector-base-eval-run-id "${{ steps.resolve.outputs.selector_base_eval_run_id }}")
          fi
          if [ -n "${{ steps.resolve.outputs.execution_baseline_id }}" ]; then
            args+=(--execution-baseline-id "${{ steps.resolve.outputs.execution_baseline_id }}")
          fi
          if [ -n "${{ steps.resolve.outputs.execution_base_eval_run_id }}" ]; then
            args+=(--execution-base-eval-run-id "${{ steps.resolve.outputs.execution_base_eval_run_id }}")
          fi
          if [ -n "${{ steps.resolve.outputs.budget_baseline_id }}" ]; then
            args+=(--budget-baseline-id "${{ steps.resolve.outputs.budget_baseline_id }}")
          fi
          if [ -n "${{ steps.resolve.outputs.budget_base_eval_run_id }}" ]; then
            args+=(--budget-base-eval-run-id "${{ steps.resolve.outputs.budget_base_eval_run_id }}")
          fi
          if [ -n "${INPUT_MIN_PASS_RATE}" ]; then
            args+=(--min-pass-rate "${INPUT_MIN_PASS_RATE}")
          fi
          if [ -n "${INPUT_MIN_CRITICAL_PASS_RATE}" ]; then
            args+=(--min-critical-pass-rate "${INPUT_MIN_CRITICAL_PASS_RATE}")
          fi
          if [ -n "${INPUT_MIN_ROUTE_AGREEMENT_RATE}" ]; then
            args+=(--min-route-agreement-rate "${INPUT_MIN_ROUTE_AGREEMENT_RATE}")
          fi
          if [ -n "${INPUT_MIN_ROUTE_COMPATIBLE_RATE}" ]; then
            args+=(--min-route-compatible-rate "${INPUT_MIN_ROUTE_COMPATIBLE_RATE}")
          fi
          if [ -n "${INPUT_MAX_CLARIFY_RATE_DELTA}" ]; then
            args+=(--max-clarify-rate-delta "${INPUT_MAX_CLARIFY_RATE_DELTA}")
          fi
          if [ -n "${INPUT_SELECTOR_MAX_CRITICAL_REGRESSIONS}" ]; then
            args+=(--selector-max-critical-regressions "${INPUT_SELECTOR_MAX_CRITICAL_REGRESSIONS}")
          fi
          if [ -n "${INPUT_MAX_PASS_RATE_DROP}" ]; then
            args+=(--max-pass-rate-drop "${INPUT_MAX_PASS_RATE_DROP}")
          fi
          if [ -n "${INPUT_EXECUTION_MAX_CRITICAL_REGRESSIONS}" ]; then
            args+=(--execution-max-critical-regressions "${INPUT_EXECUTION_MAX_CRITICAL_REGRESSIONS}")
          fi
          if [ -n "${INPUT_MAX_VERIFICATION_PASS_RATE_DROP}" ]; then
            args+=(--max-verification-pass-rate-drop "${INPUT_MAX_VERIFICATION_PASS_RATE_DROP}")
          fi
          if [ -n "${INPUT_MAX_EVIDENCE_BACKED_PASS_RATE_DROP}" ]; then
            args+=(--max-evidence-backed-pass-rate-drop "${INPUT_MAX_EVIDENCE_BACKED_PASS_RATE_DROP}")
          fi
          if [ -n "${INPUT_MIN_MEDIAN_SCHEMA_BYTE_REDUCTION_RATE}" ]; then
            args+=(--min-median-schema-byte-reduction-rate "${INPUT_MIN_MEDIAN_SCHEMA_BYTE_REDUCTION_RATE}")
          fi
          if [ -n "${INPUT_MAX_MEDIAN_LATENCY_INCREASE_RATE}" ]; then
            args+=(--max-median-latency-increase-rate "${INPUT_MAX_MEDIAN_LATENCY_INCREASE_RATE}")
          fi
          if [ -n "${INPUT_ALLOWED_FINAL_NATIVE_TOOLS}" ]; then
            args+=(--allowed-final-native-tools "${INPUT_ALLOWED_FINAL_NATIVE_TOOLS}")
          fi

          "${args[@]}"

      - name: Publish cutover readiness summary
        if: always() && steps.resolve.outputs.skip != 'true'
        shell: bash
        run: |
          {
            echo "## Cutover Readiness"
            echo
            if [ -f docs/reports/cutover_readiness_report.md ]; then
              cat docs/reports/cutover_readiness_report.md
            else
              echo "Report missing: docs/reports/cutover_readiness_report.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cutover readiness artifacts
        if: always() && steps.resolve.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cutover-readiness-report
          if-no-files-found: warn
          path: |
            docs/reports/cutover_readiness_report.json
            docs/reports/cutover_readiness_report.md

      - name: Enforce cutover readiness verdict
        if: always() && steps.resolve.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path("docs/reports/cutover_readiness_report.json")
          if not report_path.is_file():
              print("cutover readiness report was not generated", file=sys.stderr)
              sys.exit(1)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          if not bool(report.get("ready")):
              print(f"cutover readiness failed with status={report.get('status')}", file=sys.stderr)
              sys.exit(1)

          print("cutover readiness passed")
          PY
