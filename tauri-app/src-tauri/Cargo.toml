[package]
name = "zimaos-blue"
version = "0.10.35"
description = "ZimaOS Blue - AI Gateway Desktop Application"
authors = ["ZimaOS Team"]
edition = "2021"
rust-version = "1.70"
default-run = "zimaos-blue"
autobins = false

[lib]
name = "zimaos_blue_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "zimaos-blue"
path = "src/main.rs"

[[example]]
name = "embedded_startup_probe"
path = "examples/embedded_startup_probe.rs"
required-features = ["startup-probe"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "webview-data-url", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
open = "5"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
once_cell = "1.19"
dirs = "5"
sys-locale = "0.3"

# Platform-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
# macOS uses CGO library approach - no additional deps needed for static linking
objc2-app-kit = "0.3"
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
startup-probe = []

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = 3
strip = true
split-debuginfo = "packed"

[profile.release.package."*"]
opt-level = 2
