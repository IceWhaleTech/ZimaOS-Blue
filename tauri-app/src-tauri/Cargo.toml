[package]
name = "zimaos-echo"
version = "0.10.4"
description = "ZimaOS Echo - AI Gateway Desktop Application"
authors = ["ZimaOS Team"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "zimaos_echo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json"] }
once_cell = "1.19"

# Platform-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
# macOS uses CGO library approach - no additional deps needed for static linking

[target.'cfg(target_os = "windows")'.dependencies]
# Windows uses sidecar approach - no additional deps needed

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
