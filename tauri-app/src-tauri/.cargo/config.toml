# Platform-specific build targets are passed via --target flag in build scripts.
# Do NOT set [build] target here — it breaks cross-platform builds.
#
# macOS:  native (no --target needed, uses host triple)
# Windows: --target x86_64-pc-windows-gnu (set in build-all.ps1)
# Linux:   native (no --target needed)

# Link-time optimization for smaller binaries
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"  # Optimize for size
strip = true     # Strip symbols

# Windows GNU target: static link libgcc to avoid external dependencies
[target.x86_64-pc-windows-gnu]
rustflags = [
    "-C", "link-arg=-static-libgcc",
]
