<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the globe -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <!-- Gradient for the signal waves -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="50%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#6EE7B7"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Globe/Earth circle -->
  <circle cx="24" cy="24" r="14" fill="url(#globeGrad)" opacity="0.9"/>

  <!-- Globe grid lines -->
  <ellipse cx="24" cy="24" rx="14" ry="6" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="24" cy="24" rx="6" ry="14" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
  <line x1="10" y1="24" x2="38" y2="24" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
  <line x1="24" y1="10" x2="24" y2="38" stroke="#fff" stroke-width="0.8" opacity="0.4"/>

  <!-- Connection signal waves (animated) -->
  <g filter="url(#glow)">
    <!-- Wave 1 -->
    <path d="M6 18 Q2 24 6 30" fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <!-- Wave 2 -->
    <path d="M3 15 Q-2 24 3 33" fill="none" stroke="url(#waveGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </path>

    <!-- Wave 3 (right side) -->
    <path d="M42 18 Q46 24 42 30" fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <!-- Wave 4 -->
    <path d="M45 15 Q50 24 45 33" fill="none" stroke="url(#waveGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.5s" repeatCount="indefinite" begin="0.8s"/>
    </path>
  </g>

  <!-- Center lightning bolt (auto/smart) -->
  <path d="M26 16 L21 24 L25 24 L22 32 L29 22 L25 22 L28 16 Z" fill="#FBBF24" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- Orbiting dot -->
  <circle r="2" fill="#10B981" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite">
      <mpath href="#orbitPath"/>
    </animateMotion>
  </circle>
  <path id="orbitPath" d="M24 6 A18 18 0 1 1 23.99 6" fill="none" stroke="none"/>
</svg>
