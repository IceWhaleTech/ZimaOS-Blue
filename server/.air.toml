root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -tags dev -o ./tmp/blue ./cmd/blue"
  entrypoint = "./tmp/blue"
  args = ["--no-intercept", "gateway", "run"]
  include_ext = ["go", "tmpl", "html", "yaml", "yml", "json"]
  exclude_dir = ["tmp", "vendor", "testdata", "node_modules"]
  exclude_untracked = false
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  main_only = true
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
