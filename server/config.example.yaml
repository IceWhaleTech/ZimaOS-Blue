# Default configuration for ZimaOS-Blue
# Copy this file to config.yaml and modify as needed

server:
  host: "0.0.0.0"
  port: 80
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"

log:
  level: "info"      # debug, info, warn, error
  format: "console"  # json, console
  output: "stdout"   # stdout, stderr, or file path

worker:
  pool_size: 10
  max_queue_len: 100

# Resource limits (Go runtime level)
resources:
  max_memory_mb: 512      # Maximum memory in MB (0 = no limit)
  max_cpu_percent: 50     # Maximum CPU percentage (0 = no limit)
  max_open_files: 65536   # Maximum open file descriptors
  max_goroutines: 10000   # Maximum goroutines (0 = no limit)
  gc_percent: 100         # GC target percentage

# Cgroup v2 configuration (Linux only)
# Requires root privileges or appropriate cgroup delegation
cgroup:
  enabled: false
  cgroup_root: "/sys/fs/cgroup"
  cgroup_name: "zimaos-blue"

  # IO bandwidth limits
  io:
    enabled: false
    read_bps: 0           # Max read bytes/sec (0 = unlimited)
    write_bps: 0          # Max write bytes/sec (0 = unlimited)
    read_iops: 0          # Max read IOPS (0 = unlimited)
    write_iops: 0         # Max write IOPS (0 = unlimited)
    devices: []           # Device major:minor list (empty = auto-detect root)

  # Memory limits (alternative to resources.max_memory_mb)
  memory:
    enabled: false
    max_bytes: 0          # Hard limit in bytes (0 = unlimited)
    high_bytes: 0         # Soft limit in bytes (0 = disabled)
    swap_max_bytes: 0     # Swap limit in bytes (0 = unlimited)

  # CPU limits (alternative to resources.max_cpu_percent)
  cpu:
    enabled: false
    max_percent: 0        # Max CPU percentage (0 = unlimited)
    weight: 100           # CPU weight (1-10000, default 100)

# API Proxy Configuration (v0.10.5.1+)
proxy:
  enabled: true

  # Port configuration
  port:
    value: 0              # 0 = dynamic allocation
    range: "9000-9100"    # Port range for dynamic allocation
    bind_address: "127.0.0.1"
    port_file: ""         # Optional: write allocated port to file

  # Provider routing configuration
  routing:
    default_provider: "anthropic"
    load_balancing: "priority"  # priority, round-robin, weighted

    providers:
      - name: "anthropic"
        endpoint: "https://api.anthropic.com"
        api_key: "${ANTHROPIC_API_KEY}"
        priority: 1
        weight: 100
        enabled: true
        health_check: "/v1/messages"

      - name: "openai"
        endpoint: "https://api.openai.com"
        api_key: "${OPENAI_API_KEY}"
        priority: 2
        weight: 80
        enabled: true
        health_check: "/v1/models"

      - name: "gemini"
        endpoint: "https://generativelanguage.googleapis.com"
        api_key: "${GOOGLE_API_KEY}"
        priority: 3
        weight: 60
        enabled: false
        health_check: ""

    # Failover configuration
    failover:
      enabled: true
      max_retries: 3
      retry_delay: "1s"
      circuit_breaker: true
      failure_threshold: 5
      recovery_timeout: "30s"
      provider_race:
        enabled: false
        max_parallel: 2
        min_providers: 2
        empty_rate_min_samples: 10
        empty_rate_cooldown_threshold: 0.3
        empty_rate_sink_threshold: 0.5
        empty_rate_exclude_threshold: 0.8
        empty_rate_cooldown: "2m"

  # Connection pool configuration
  connection:
    max_idle_conns: 100
    max_idle_conns_per_host: 10
    max_conns_per_host: 100
    idle_conn_timeout: "90s"
    keep_alive: true
    keep_alive_interval: "30s"
    dial_timeout: "30s"
    tls_handshake_timeout: "10s"
    response_header_timeout: "60s"
    force_http2: true

  # Health check configuration
  health_check:
    enabled: true
    interval: "30s"
    timeout: "10s"

  # Model Router configuration (Antigravity-inspired)
  model_router:
    enabled: true
    default_family: "claude-3"

    families:
      - name: "claude-3"
        patterns:
          - "^claude-3.*"
          - "^claude-opus.*"
          - "^claude-sonnet.*"
        provider: "anthropic"
        fallback: "claude-3-haiku-20240307"

      - name: "gpt-4"
        patterns:
          - "^gpt-4.*"
          - "^chatgpt-4.*"
        provider: "openai"
        fallback: "gpt-4o-mini"

      - name: "gemini-pro"
        patterns:
          - "^gemini-.*-pro.*"
          - "^gemini-pro.*"
        provider: "google"
        fallback: "gemini-1.5-flash"

      - name: "gemini-flash"
        patterns:
          - "^gemini-.*-flash.*"
        provider: "google"
        fallback: ""  # Already a flash model

    # Expert-level regex rules (highest priority)
    regex_rules:
      - pattern: "^claude-3-opus-latest$"
        target: "claude-3-opus-20240229"
        provider: "anthropic"
        priority: 1
        description: "Pin opus-latest to specific version"

    # Models for background tasks
    background_models:
      - "claude-3-haiku"
      - "gpt-4o-mini"
      - "gemini-1.5-flash"

  # Quota Monitor configuration (Antigravity-inspired)
  quota_monitor:
    enabled: true
    sync_interval: "5m"
    warning_threshold: 20.0    # Warn when below 20%
    critical_threshold: 5.0    # Critical when below 5%
    track_tokens: true
    track_requests: true
