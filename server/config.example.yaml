# Default configuration for ZimaOS-Blue
# Copy this file to config.yaml and modify as needed

server:
  host: "0.0.0.0"
  port: 80
  read_timeout: "5m"
  write_timeout: "5m"
  idle_timeout: "120s"

log:
  level: "info"      # debug, info, warn, error
  format: "console"  # json, console
  output: "stdout"   # stdout, stderr, or file path

worker:
  pool_size: 10
  max_queue_len: 100

# Resource limits (Go runtime level)
resources:
  max_memory_mb: 512      # Maximum memory in MB (0 = no limit)
  max_cpu_percent: 50     # Maximum CPU percentage (0 = no limit)
  max_open_files: 65536   # Maximum open file descriptors
  max_goroutines: 10000   # Maximum goroutines (0 = no limit)
  gc_percent: 100         # GC target percentage

# Cgroup v2 configuration (Linux only)
# Requires root privileges or appropriate cgroup delegation
cgroup:
  enabled: false
  cgroup_root: "/sys/fs/cgroup"
  cgroup_name: "zimaos-blue"

  # IO bandwidth limits
  io:
    enabled: false
    read_bps: 0           # Max read bytes/sec (0 = unlimited)
    write_bps: 0          # Max write bytes/sec (0 = unlimited)
    read_iops: 0          # Max read IOPS (0 = unlimited)
    write_iops: 0         # Max write IOPS (0 = unlimited)
    devices: []           # Device major:minor list (empty = auto-detect root)

  # Memory limits (alternative to resources.max_memory_mb)
  memory:
    enabled: false
    max_bytes: 0          # Hard limit in bytes (0 = unlimited)
    high_bytes: 0         # Soft limit in bytes (0 = disabled)
    swap_max_bytes: 0     # Swap limit in bytes (0 = unlimited)

  # CPU limits (alternative to resources.max_cpu_percent)
  cpu:
    enabled: false
    max_percent: 0        # Max CPU percentage (0 = unlimited)
    weight: 100           # CPU weight (1-10000, default 100)

# API Proxy Configuration (v0.10.5.1+)
proxy:
  enabled: true

  # Port configuration
  port:
    value: 0              # 0 = dynamic allocation
    range: "9000-9100"    # Port range for dynamic allocation
    bind_address: "127.0.0.1"
    port_file: ""         # Optional: write allocated port to file

  # Provider routing configuration
  routing:
    default_provider: "anthropic"
    load_balancing: "priority"  # priority, round-robin, weighted

    providers:
      - name: "anthropic"
        endpoint: "https://api.anthropic.com"
        api_key: "${ANTHROPIC_API_KEY}"
        priority: 1
        weight: 100
        enabled: true
        health_check: "/v1/messages"

      - name: "openai"
        endpoint: "https://api.openai.com"
        api_key: "${OPENAI_API_KEY}"
        priority: 2
        weight: 80
        enabled: true
        health_check: "/v1/models"

      - name: "gemini"
        endpoint: "https://generativelanguage.googleapis.com"
        api_key: "${GOOGLE_API_KEY}"
        priority: 3
        weight: 60
        enabled: false
        health_check: ""

    # Failover configuration
    failover:
      enabled: true
      max_retries: 3
      retry_delay: "1s"
      circuit_breaker: true
      failure_threshold: 5
      recovery_timeout: "30s"
      provider_race:
        enabled: false
        max_parallel: 2
        min_providers: 2
        empty_rate_min_samples: 10
        empty_rate_cooldown_threshold: 0.3
        empty_rate_sink_threshold: 0.5
        empty_rate_exclude_threshold: 0.8
        empty_rate_cooldown: "2m"

  # Connection pool configuration
  connection:
    max_idle_conns: 100
    max_idle_conns_per_host: 10
    max_conns_per_host: 100
    idle_conn_timeout: "90s"
    keep_alive: true
    keep_alive_interval: "30s"
    dial_timeout: "30s"
    tls_handshake_timeout: "10s"
    response_header_timeout: "10m"
    force_http2: true

  # Health check configuration
  health_check:
    enabled: true
    interval: "30s"
    timeout: "10s"

  # Model Router configuration (Antigravity-inspired)
  model_router:
    enabled: true
    default_family: "claude-3"

    families:
      - name: "claude-3"
        patterns:
          - "^claude-3.*"
          - "^claude-opus.*"
          - "^claude-sonnet.*"
        provider: "anthropic"
        fallback: "claude-3-haiku-20240307"

      - name: "gpt-4"
        patterns:
          - "^gpt-4.*"
          - "^chatgpt-4.*"
        provider: "openai"
        fallback: "gpt-4o-mini"

      - name: "gemini-pro"
        patterns:
          - "^gemini-.*-pro.*"
          - "^gemini-pro.*"
        provider: "google"
        fallback: "gemini-1.5-flash"

      - name: "gemini-flash"
        patterns:
          - "^gemini-.*-flash.*"
        provider: "google"
        fallback: ""  # Already a flash model

    # Expert-level regex rules (highest priority)
    regex_rules:
      - pattern: "^claude-3-opus-latest$"
        target: "claude-3-opus-20240229"
        provider: "anthropic"
        priority: 1
        description: "Pin opus-latest to specific version"

    # Models for background tasks
    background_models:
      - "claude-3-haiku"
      - "gpt-4o-mini"
      - "gemini-1.5-flash"

  # Quota Monitor configuration (Antigravity-inspired)
  quota_monitor:
    enabled: true
    sync_interval: "5m"
    warning_threshold: 20.0    # Warn when below 20%
    critical_threshold: 5.0    # Critical when below 5%
    track_tokens: true
    track_requests: true

# OTA update
update:
  enabled: true
  check_interval: "24h"
  auto_download: false
  auto_apply: false
  release_channel: "stable"  # stable, beta, alpha
  backup_count: 3
  storage_path: "./data/updates"

# Tool calling adapters + web runtime
tool_calling:
  auto_detect: true
  detection_timeout: "5m"
  web_search:
    provider: "duckduckgo"  # single provider (legacy)
    providers: ["duckduckgo", "bing"]  # high availability chain, priority order
    api_key: ""             # required for brave
    base_url: ""            # required for searxng
    max_results: 5
    timeout: "5m"
    safe_search: false
    region: "wt-wt"
  web_fetch:
    allow_private_hosts: false
    timeout: "5m"
    firecrawl_timeout: "5m"
  ripgrep:
    enabled: true
    auto_download: true
    allow_system_binary: true
    cache_dir: ""          # default: <dataDir>/tools/ripgrep
    mirror_base_url: ""    # deprecated single-mirror override
    mirror_base_urls:
      - "https://mirror.ghproxy.com"
      - "https://gh-proxy.com"
      - "https://downloads.sourceforge.net/project/ripgrep.mirror"

# Runtime performance and lazy-resource reclaim
performance:
  database:
    pool_size: 10
    max_idle_conns: 5
    conn_max_lifetime: "1h"
    conn_max_idle_time: "10m"
    wal_mode: true
    cache_size: 2000
    page_size: 4096
    checkpoint_interval: "5m"
    batch_size: 1000
    slow_query_threshold: "100ms"
    enable_query_cache: true

  resource_reclaim:
    enabled: true
    browser_idle_after: "10m"
    workflow_idle_after: "15m"
    cron_idle_after: "15m"
    stt_idle_after: "10m"
    speech_status_does_not_prewarm_stt: true

# Browser automation runtime
browser:
  driver: "managed"     # managed (launch isolated Chromium) or relay/cdp (attach to an existing CDP endpoint)
  relay_enabled: false  # starts Blue's built-in loopback relay for the companion Chrome extension
  relay_host: "127.0.0.1"
  relay_port: 18792
  relay_token: ""       # optional; if empty Blue generates one at startup
  pool_size: 3
  headless: true         # runtime default; chat card "use_browser" opens a visible window automatically
  default_timeout: 60000
  max_timeout: 300000
  default_viewport_width: 1920
  default_viewport_height: 1080
  allowed_domains: []
  blocked_domains: []
  user_agent: ""
  proxy_url: ""
  browser_path: ""      # optional explicit Chrome/Chromium path
  cdp_url: ""           # external relay/CDP endpoint; leave empty to use Blue's built-in relay when relay_enabled=true
  evaluate_enabled: true

# Harness control plane (runtime-first, benchmark-ready)
harness:
  enabled: true
  store_path: "./data/blue.db"   # shared main DB; legacy harness.db installs are migrated into blue.db
  artifact_root: "./data/harness/artifacts"
  event_retention_days: 30
  default_approval_mode: "ask"   # ask, allow, deny
  default_sandbox_mode: "inherit"
  default_max_duration: "30m"
  default_max_steps: 32
  default_max_tool_rounds: 50

# Session settings (conversation context + audit trail)
session:
  max_tokens: 0                  # 0 = auto-resolve from model context window; use a positive value to force a fixed history budget
  audit:
    enabled: true
    path: ""                      # empty = reuse blue.db; set a file path to isolate audit logs
    retention_days: 30
    cleanup_interval: "6h"
    cleanup_batch_size: 500
