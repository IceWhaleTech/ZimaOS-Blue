# ZimaOS-Blue Configuration

server:
  host: "0.0.0.0"
  port: 23456
  port_auto_fallback: true  # Auto fallback to random port if configured port is in use

log:
  level: "debug"
  format: "console"

# =============================================================================
# API Proxy Configuration (v0.10.5.1+)
# =============================================================================
# OpenAI-compatible API proxy on /v1/* (unified port architecture)
# This allows external apps and Claude Code CLI to use Echo as an OpenAI-compatible API
# =============================================================================
proxy:
  enabled: true

  # Provider routing configuration
  routing:
    default_provider: "anthropic"
    load_balancing: "priority"  # priority, round-robin, weighted

    providers:
      - name: "anthropic"
        endpoint: "https://api.anthropic.com"  # Base URL only, path handled by converter
        api_key: ""  # Empty = pass-through client's Authorization header
        priority: 1
        weight: 100
        enabled: true
        health_check: "/v1/messages"

      - name: "openai"
        endpoint: "https://api.openai.com"
        api_key: ""  # Empty = pass-through client's Authorization header
        priority: 2
        weight: 80
        enabled: true
        health_check: "/v1/models"

      - name: "gemini"
        endpoint: "https://generativelanguage.googleapis.com"  # Google AI Studio
        api_key: ""  # Get from https://aistudio.google.com/apikey
        priority: 3
        weight: 70
        enabled: false  # Enable after setting API key
        health_check: "/v1beta/models"

    # Failover configuration
    failover:
      enabled: true
      max_retries: 3
      retry_delay: "1s"
      circuit_breaker: true
      failure_threshold: 5
      recovery_timeout: "30s"

  # Connection pool configuration
  connection:
    max_idle_conns: 100
    max_idle_conns_per_host: 10
    max_conns_per_host: 100
    idle_conn_timeout: "90s"
    keep_alive: true
    keep_alive_interval: "30s"
    dial_timeout: "30s"
    tls_handshake_timeout: "10s"
    response_header_timeout: "60s"
    force_http2: true

  # Health check configuration
  health_check:
    enabled: true
    interval: "30s"
    timeout: "10s"

  # =============================================================================
  # cc-cache: Response Caching (v0.10.13+)
  # =============================================================================
  # Intelligent caching for LLM API responses to reduce latency and costs
  # =============================================================================
  cache:
    enabled: true  # Master switch, default: true

    # Storage settings
    storage_type: "memory"  # memory, disk, multilevel
    storage_path: ""        # Path for disk cache (empty = ./data/cache)

    # Cache limits
    max_size: 10000         # Max cache entries
    max_entry_size: 1048576 # Max size per entry (1MB)
    max_memory_mb: 256      # Max memory usage
    ttl: "30m"              # Default TTL for cache entries

    # Cache behavior
    cacheable_status_codes: [200]
    cacheable_methods: ["POST"]  # LLM APIs use POST
    skip_streaming: true         # Don't cache streaming responses

    # Cache key settings
    key_include_headers: []      # Headers to include in cache key
    key_ignore_params: []        # Query params to ignore

    # Semantic caching (experimental)
    semantic_cache:
      enabled: false             # Requires embedding provider
      similarity_threshold: 0.95
      embedding_provider: ""
      embedding_model: ""

    # Cache warming (experimental)
    warming:
      enabled: false
      interval: "5m"
      max_requests: 100

# =============================================================================
# Claude Code CLI Configuration
# =============================================================================
# IMPORTANT: This is NOT an LLM provider. Claude Code CLI is a separate tool
# that enables advanced features like Skills, Tool Calling, File Operations, etc.
#
# In the Settings UI, this should appear as a separate section from LLM Providers.
# =============================================================================
claude_code_cli:
  # Master switch - strongly recommended to keep enabled
  # When disabled, the following features will be unavailable:
  # - Skills
  # - Tool Calling (via CLI adapter)
  # - File Operations
  # - Terminal Commands
  # - MCP Integration
  # - Agent Mode
  # - Project Context
  enabled: true  # Default: true (strongly recommended)

  # Installation settings
  install:
    path: ""  # Empty = auto-detect or ~/.local/share/zimaos-blue/claude-code
    auto_update: false
    verify_checksum: true

  # Download settings
  download:
    base_url: "https://storage.googleapis.com/anthropic-public/claude-code"
    cache_dir: ""  # Empty = ~/.local/share/zimaos-blue/cache

  # Feature toggles (only effective when enabled=true)
  features:
    skills: true
    tool_calling: true
    file_operations: true
    terminal_commands: true
    mcp_integration: true
    agent_mode: true
    project_context: true

  # CLI backend settings (for advanced users)
  backend:
    command: "claude"
    workspace_dir: "."
    default_model: "sonnet"
    timeout: "5m"
    session_ttl: "24h"
    args: ["-p", "--output-format", "text", "--dangerously-skip-permissions"]
    resume_args: ["-p", "--output-format", "text", "--dangerously-skip-permissions", "--resume", "{sessionId}"]
    output: "text"
    resume_output: "text"
    input: "arg"
    max_prompt_arg_chars: 100000
    model_arg: "--model"
    model_aliases:
      opus: "opus"
      sonnet: "sonnet"
      haiku: "haiku"
    session_arg: "--session-id"
    session_mode: "always"
    system_prompt_arg: "--append-system-prompt"
    system_prompt_mode: "append"
    system_prompt_when: "first"
    serialize: true

# =============================================================================
# LLM Provider Configuration
# =============================================================================
# These are the actual LLM providers for chat functionality.
# NOTE: Claude Code CLI is NOT listed here - it's a separate tool, not a provider.
# =============================================================================
llm:
  providers:
    # Anthropic Claude API (direct API access, not via CLI)
    anthropic:
      enabled: true
      api_key: ""  # Or from ANTHROPIC_API_KEY env
      model: "claude-3-5-sonnet-20241022"
      base_url: ""  # Optional custom endpoint

    openai:
      enabled: true
      api_key: ""  # Or from OPENAI_API_KEY env
      base_url: ""  # Optional custom endpoint
      model: "gpt-4o"

    ollama:
      enabled: true
      endpoints:
        - "http://localhost:11434"
        - "http://127.0.0.1:11434"
      auto_detect: true
      default_model: "llama3.2"

  # Default provider selection
  default_provider: "anthropic"

  # Fallback chain
  fallback:
    enabled: true
    chain:
      - "anthropic"
      - "openai"
      - "ollama"

# First-run wizard
first_run:
  enabled: true
  show_provider_detection: true
  show_cli_download: true
  allow_skip: true
  recommend_cli: true  # Show "strongly recommended" message

# cc-switch integration
cc_switch:
  enabled: true
  config_path: ""  # Empty = ~/.claude-code-switch/config.json
  sync_profiles: true

# Statistics collection
statistics:
  enabled: true
  opt_in_required: true
  storage_path: ""  # Empty = ~/.local/share/zimaos-blue/stats
  retention_days: 90

# Tool calling adapters
tool_calling:
  auto_detect: true
  detection_timeout: "5s"

  adapters:
    cli_proxy:
      enabled: true  # Only works when claude_code_cli.enabled=true
      prompt_template: "default"

    cc_nexus:
      enabled: true
      schema_mapping: "auto"

  provider_overrides:
    ollama:
      tool_calling: "adapter"
    custom:
      tool_calling: "auto"

